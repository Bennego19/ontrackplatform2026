services:
  - type: web
    name: ontrack-backend
    env: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000  # Changed from 10000 to 3000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # You'll set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://platform.ontrackconnect.co.za
    healthCheckPath: /api/health
    autoDeploy: true